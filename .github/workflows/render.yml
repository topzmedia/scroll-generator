name: Render Video

on:
  workflow_dispatch:
    inputs:
      cell_key:
        required: true
        type: string
      image_r2_key:
        required: true
        type: string
      text:
        required: true
        type: string
      scroll_speed:
        required: false
        type: string
        default: "80"
      hook_font_size:
        required: false
        type: string
        default: "52"
      body_font_size:
        required: false
        type: string
        default: "38"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install Pillow boto3

      - name: Download image from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          IMAGE_R2_KEY: ${{ inputs.image_r2_key }}
        run: |
          python3 -c "
          import boto3, os, pathlib
          s3 = boto3.client('s3',
              endpoint_url='https://346c911ecd013de0d51b44f77e5f2ec0.r2.cloudflarestorage.com',
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              region_name='auto')
          key = os.environ['IMAGE_R2_KEY']
          ext = pathlib.Path(key).suffix or '.png'
          local_path = f'/tmp/input_image{ext}'
          s3.download_file('scroll-generator', key, local_path)
          with open('/tmp/image_path.txt', 'w') as f:
              f.write(local_path)
          print(f'Downloaded {key} to {local_path}')
          "

      - name: Write text to file
        env:
          VIDEO_TEXT: ${{ inputs.text }}
        run: |
          python3 -c "
          import os
          text = os.environ['VIDEO_TEXT']
          with open('/tmp/text_input.txt', 'w') as f:
              f.write(text)
          print(f'Wrote {len(text)} chars to /tmp/text_input.txt')
          "

      - name: Render video
        env:
          SCROLL_SPEED: ${{ inputs.scroll_speed }}
          HOOK_FONT_SIZE: ${{ inputs.hook_font_size }}
          BODY_FONT_SIZE: ${{ inputs.body_font_size }}
        run: |
          python3 -c "
          import os
          from renderer import render_video
          with open('/tmp/text_input.txt') as f:
              text = f.read()
          image_path = open('/tmp/image_path.txt').read().strip()
          render_video(
              image_path=image_path,
              text=text,
              output_path='/tmp/output.mp4',
              scroll_speed=int(os.environ.get('SCROLL_SPEED', '80')),
              hook_font_size=int(os.environ.get('HOOK_FONT_SIZE', '52')),
              body_font_size=int(os.environ.get('BODY_FONT_SIZE', '38')),
          )
          print('Video rendered successfully')
          "

      - name: Upload video to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CELL_KEY: ${{ inputs.cell_key }}
        run: |
          python3 -c "
          import boto3, os
          s3 = boto3.client('s3',
              endpoint_url='https://346c911ecd013de0d51b44f77e5f2ec0.r2.cloudflarestorage.com',
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              region_name='auto')
          cell_key = os.environ['CELL_KEY']
          s3.upload_file('/tmp/output.mp4', 'scroll-generator',
              f'videos/generated/{cell_key}.mp4',
              ExtraArgs={'ContentType': 'video/mp4'})
          print(f'Uploaded videos/generated/{cell_key}.mp4 to R2')
          "

      - name: Notify completion
        if: always()
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CELL_KEY: ${{ inputs.cell_key }}
        run: |
          STATUS="done"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="error"
          fi
          curl -s -X POST "${WORKER_URL}/api/webhook/complete" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WEBHOOK_SECRET}" \
            -d "{\"cell_key\": \"${CELL_KEY}\", \"status\": \"${STATUS}\"}"
