name: Render Video

on:
  workflow_dispatch:
    inputs:
      cell_key:
        required: true
        type: string
      image_r2_key:
        required: true
        type: string
      text:
        required: true
        type: string
      scroll_speed:
        required: false
        type: string
        default: "80"
      hook_font_size:
        required: false
        type: string
        default: "52"
      body_font_size:
        required: false
        type: string
        default: "38"
      voice:
        required: false
        type: string
        default: ""
      voice_volume:
        required: false
        type: string
        default: "100"
      music_r2_key:
        required: false
        type: string
        default: ""
      music_volume:
        required: false
        type: string
        default: "30"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install Pillow boto3 requests edge-tts

      - name: Render and upload
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CELL_KEY: ${{ inputs.cell_key }}
          IMAGE_R2_KEY: ${{ inputs.image_r2_key }}
          VIDEO_TEXT: ${{ inputs.text }}
          SCROLL_SPEED: ${{ inputs.scroll_speed }}
          HOOK_FONT_SIZE: ${{ inputs.hook_font_size }}
          BODY_FONT_SIZE: ${{ inputs.body_font_size }}
          VOICE: ${{ inputs.voice }}
          VOICE_VOLUME: ${{ inputs.voice_volume }}
          MUSIC_R2_KEY: ${{ inputs.music_r2_key }}
          MUSIC_VOLUME: ${{ inputs.music_volume }}
        run: python3 ci_render.py

      - name: Notify completion
        if: always()
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CELL_KEY: ${{ inputs.cell_key }}
        run: |
          STATUS="done"
          SIZE=0
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="error"
          else
            SIZE=$(stat -c%s /tmp/output.mp4 2>/dev/null || stat -f%z /tmp/output.mp4 2>/dev/null || echo 0)
          fi
          curl -s -X POST "${WORKER_URL}/api/webhook/complete" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WEBHOOK_SECRET}" \
            -d "{\"cell_key\": \"${CELL_KEY}\", \"status\": \"${STATUS}\", \"size\": ${SIZE}}"
