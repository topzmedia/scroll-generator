name: Render Video

on:
  workflow_dispatch:
    inputs:
      cell_key:
        required: true
        type: string
      image_r2_key:
        required: true
        type: string
      text:
        required: true
        type: string
      scroll_speed:
        required: false
        type: string
        default: "80"
      hook_font_size:
        required: false
        type: string
        default: "52"
      body_font_size:
        required: false
        type: string
        default: "38"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install Pillow boto3

      - name: Download image from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 -c "
          import boto3, os
          s3 = boto3.client('s3',
              endpoint_url='https://346c911ecd013de0d51b44f77e5f2ec0.r2.cloudflarestorage.com',
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              region_name='auto')
          s3.download_file('scroll-generator', '${{ inputs.image_r2_key }}', '/tmp/input_image${{ inputs.image_r2_key }}')
          " 2>&1 || true
          # Handle extension properly
          python3 -c "
          import boto3, os, pathlib
          s3 = boto3.client('s3',
              endpoint_url='https://346c911ecd013de0d51b44f77e5f2ec0.r2.cloudflarestorage.com',
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              region_name='auto')
          key = '${{ inputs.image_r2_key }}'
          ext = pathlib.Path(key).suffix or '.png'
          local_path = f'/tmp/input_image{ext}'
          s3.download_file('scroll-generator', key, local_path)
          with open('/tmp/image_path.txt', 'w') as f:
              f.write(local_path)
          "

      - name: Render video
        run: |
          IMAGE_PATH=$(cat /tmp/image_path.txt)
          # Write text to file to handle special characters
          python3 -c "
          import sys
          text = '''${{ inputs.text }}'''
          with open('/tmp/text_input.txt', 'w') as f:
              f.write(text)
          "
          python3 -c "
          from renderer import render_video
          with open('/tmp/text_input.txt') as f:
              text = f.read()
          image_path = open('/tmp/image_path.txt').read().strip()
          render_video(
              image_path=image_path,
              text=text,
              output_path='/tmp/output.mp4',
              scroll_speed=int('${{ inputs.scroll_speed }}'),
              hook_font_size=int('${{ inputs.hook_font_size }}'),
              body_font_size=int('${{ inputs.body_font_size }}'),
          )
          print('Video rendered successfully')
          "

      - name: Upload video to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 -c "
          import boto3, os
          s3 = boto3.client('s3',
              endpoint_url='https://346c911ecd013de0d51b44f77e5f2ec0.r2.cloudflarestorage.com',
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              region_name='auto')
          s3.upload_file('/tmp/output.mp4', 'scroll-generator',
              'videos/generated/${{ inputs.cell_key }}.mp4',
              ExtraArgs={'ContentType': 'video/mp4'})
          print('Uploaded to R2')
          "

      - name: Notify completion
        if: always()
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          STATUS="done"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="error"
          fi
          curl -s -X POST "${WORKER_URL}/api/webhook/complete" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WEBHOOK_SECRET}" \
            -d "{\"cell_key\": \"${{ inputs.cell_key }}\", \"status\": \"${STATUS}\"}"
